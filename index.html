```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6f8;
      color: #222;
      padding: 40px 20px;
    }

    .settings-container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 30px;
      padding-bottom: 25px;
      border-bottom: 1px solid #eee;
    }

    .section:last-of-type {
      border-bottom: none;
    }

    .section h2 {
      font-size: 18px;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #555;
    }

    input.error,
    select.error {
      border-color: #d93025;
    }

    .error-message {
      display: none;
      color: #d93025;
      font-size: 13px;
      margin-top: 5px;
    }

    .error-message.show {
      display: block;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .checkbox-group input {
      width: auto;
    }

    .checkbox-group label {
      margin: 0;
      font-weight: normal;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #222;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .success-message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 7px;
      text-align: center;
    }

    .success-message.show {
      display: block;
    }
  </style>
</head>

<body>

  <div class="settings-container">

    <h1>Settings</h1>
    <p class="description">
      Manage your account preferences and security settings.
    </p>

    <form id="settingsForm">

      <!-- Profile -->
      <div class="section">
        <h2>Profile Information</h2>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name">
          <div class="error-message" id="nameError"></div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="example@email.com">
          <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="language">Language</label>
          <select id="language">
            <option value="">Select language</option>
            <option value="english">English</option>
            <option value="siswati">siSwati</option>
            <option value="french">French</option>
          </select>
          <div class="error-message" id="languageError"></div>
        </div>
      </div>

      <!-- Password -->
      <div class="section">
        <h2>Change Password</h2>

        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" placeholder="Enter new password">
          <div class="error-message" id="passwordError"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm password">
          <div class="error-message" id="confirmPasswordError"></div>
        </div>
      </div>

      <!-- Notifications -->
      <div class="section">
        <h2>Notifications</h2>

        <div class="checkbox-group">
          <input type="checkbox" id="emailNotifications">
          <label for="emailNotifications">
            Receive email notifications
          </label>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="marketingNotifications">
          <label for="marketingNotifications">
            Receive promotional emails
          </label>
        </div>
      </div>

      <button type="submit">Save Changes</button>

      <div class="success-message" id="successMessage">
        Settings saved successfully!
      </div>

    </form>
  </div>

  <script>
    const form = document.getElementById("settingsForm");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      let isValid = true;

      // Get values
      const name = document.getElementById("name");
      const email = document.getElementById("email");
      const language = document.getElementById("language");
      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirmPassword");

      // Reset previous errors
      document.querySelectorAll(".error-message").forEach(error => {
        error.classList.remove("show");
        error.textContent = "";
      });

      document.querySelectorAll("input, select").forEach(input => {
        input.classList.remove("error");
      });

      // Name validation
      if (name.value.trim().length < 2) {
        showError(
          name,
          "nameError",
          "Please enter your full name."
        );
        isValid = false;
      }

      // Email validation
      const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;

      if (!emailPattern.test(email.value.trim())) {
        showError(
          email,
          "emailError",
          "Please enter a valid email address."
        );
        isValid = false;
      }

      // Language validation
      if (language.value === "") {
        showError(
          language,
          "languageError",
          "Please select a language."
        );
        isValid = false;
      }

      // Password validation
      if (password.value !== "" && password.value.length < 8) {
        showError(
          password,
          "passwordError",
          "Password must contain at least 8 characters."
        );
        isValid = false;
      }

      // Confirm password validation
      if (
        password.value !== "" &&
        password.value !== confirmPassword.value
      ) {
        showError(
          confirmPassword,
          "confirmPasswordError",
          "Passwords do not match."
        );
        isValid = false;
      }

      // Submit if valid
      if (isValid) {
        document
          .getElementById("successMessage")
          .classList.add("show");

        // In a real application, send the data to your backend here.
        console.log({
          name: name.value.trim(),
          email: email.value.trim(),
          language: language.value,
          emailNotifications:
            document.getElementById("emailNotifications").checked,
          marketingNotifications:
            document.getElementById("marketingNotifications").checked
        });
      }
    });

    function showError(input, errorId, message) {
      input.classList.add("error");

      const error = document.getElementById(errorId);
      error.textContent = message;
      error.classList.add("show");
    }
  </script>

</body>
</html>
```
